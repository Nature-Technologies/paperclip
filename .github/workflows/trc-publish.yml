name: TRC publish image
run-name: Publish trc-paperclip (${{ github.ref_name }}) to GHCR

# Additive and TRC-only. Exists so chore/new-ci carries publishing on its own
# and chore/ci can be obsoleted, without editing docker.yml. Scope is narrow on
# purpose: linux/amd64, one image, a moving branch tag plus a sha tag. It does
# not replicate docker.yml's multi-arch matrix, schema-migration labels, or the
# `cloud` variant build -- CI covers tests, and the TRC deploy consumes only
# the production target of this one image.

on:
  push:
    branches: [dev, chore/new-ci]
    paths-ignore:
      # Top level only -- NEVER '**/*.md'. The whole repo is the build context,
      # so a nested .md can be image content; '**/*.md' would skip a push that
      # changes the image, nothing publishes, and the next deploy silently rolls
      # the PREVIOUS :dev image while reporting success. Kept identical across
      # the three TRC repos, where it is a live bug in trc-hermes-agent.
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: trc-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/nature-technologies/trc-paperclip

jobs:
  publish:
    name: Build and push trc-paperclip
    if: github.repository == 'Nature-Technologies/trc-paperclip'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Refresh lockfile for Docker build context
        # The Docker build's deps stage installs with a frozen lockfile, so a
        # pnpm-lock.yaml that has drifted from package.json fails the build
        # rather than the app. Refreshing it here, in the workflow that feeds
        # the Docker build context, is cheaper than requiring every commit
        # that touches package.json to also hand-refresh the lockfile.
        run: |
          set -eu
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: |
          set -eu
          # Branch ref as a moving tag, slashes flattened, plus an immutable
          # sha tag so any published build can still be named exactly.
          ref="${GITHUB_REF_NAME//\//-}"
          printf 'moving=%s:%s\n' "$IMAGE_NAME" "$ref" >> "$GITHUB_OUTPUT"
          printf 'sha=%s:sha-%s\n' "$IMAGE_NAME" "${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Pin to the production stage explicitly: the Dockerfile declares a
          # later `cloud` stage, and without a target the default would
          # silently become that stage instead.
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.moving }}
            ${{ steps.tags.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=trc-publish-amd64
          cache-to: type=gha,mode=max,scope=trc-publish-amd64
