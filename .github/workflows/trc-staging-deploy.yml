name: TRC staging deploy (paperclip)

# Additive and TRC-only. Does NOT build or publish -- docker.yml already does
# that. This rolls an already-published digest onto the staging host.
#
# Manual by design, and deliberately deferrable: bringing Paperclip up is not
# required to unblock chat.

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Digest to deploy, e.g. sha256:<64 hex>. Tags are rejected.'
        required: true
        type: string
      allow_bootstrap:
        description: 'First deploy of a FRESH instance: permit an empty paperclip-home. Leave false otherwise.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Stops this repository overlapping itself. Cross-repository races are
  # handled by the flock on the host, because a concurrency group cannot span
  # repositories.
  group: trc-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy paperclip to staging
    if: github.repository == 'Nature-Technologies/trc-paperclip'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate digest
        env:
          DIGEST: ${{ inputs.image_digest }}
        run: |
          set -eu
          hex="${DIGEST#sha256:}"
          if [ "$hex" = "$DIGEST" ]; then
            echo "::error::image_digest must start with sha256:"; exit 1
          fi
          if [ "${#hex}" -ne 64 ]; then
            echo "::error::image_digest must be sha256: plus 64 hex chars"; exit 1
          fi
          case "$hex" in
            *[!0-9a-f]*)
              echo "::error::digest hex must be lowercase 0-9a-f"; exit 1 ;;
          esac

      - name: Install SSH key and pin host key
        env:
          SSH_KEY: ${{ secrets.TRC_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TRC_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::TRC_SSH_KNOWN_HOSTS is empty. Host keys are pinned, not bypassed."
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deploy artifacts
        env:
          SSH_HOST: ${{ secrets.TRC_SSH_HOST }}
          SSH_USER: ${{ secrets.TRC_SSH_USER }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
          ALLOW_BOOTSTRAP: ${{ inputs.allow_bootstrap }}
        run: |
          set -eu
          # A workflow_dispatch boolean renders as exactly `true` or `false`.
          # Asserted because the value is placed on the ssh command line below,
          # which is only safe while it cannot hold shell metacharacters.
          case "$ALLOW_BOOTSTRAP" in
            true|false) ;;
            *)
              echo "::error::allow_bootstrap must be true or false, got '$ALLOW_BOOTSTRAP'"
              exit 1 ;;
          esac

          # The paperclip-home preconditions are checked HERE, in the same step
          # as the mkdir and BEFORE the scp, not in the deploy step -- matching
          # hermes-agent and open-webui, which moved their trc-shared check here
          # for the same reason. A wrong path or a wrong owner must fail the run
          # without a rendered .env full of secrets having been left on the host
          # first.
          #
          # The remote heredoc is quoted, so ALLOW_BOOTSTRAP reaches the remote
          # shell as an environment assignment on the ssh command line -- the
          # same place SSH_PORT and SSH_USER already travel. Nothing secret goes
          # there, and un-quoting the heredoc to interpolate it would expose
          # every other value in it to the runner's shell.
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "ALLOW_BOOTSTRAP=$ALLOW_BOOTSTRAP bash -s" <<'REMOTE'
          set -eu
          # This literal must stay equal to the PAPERCLIP_HOME_DIR value the
          # next step renders into .env; it is the same bind-mount source.
          #
          # Deliberately NOT created here, in any mode, not even with
          # allow_bootstrap=true: this directory holds secrets/master.key and
          # the only copy of the hermes_gateway wiring, so a typo'd path must
          # fail loudly rather than be silently accepted as a fresh install.
          if [ ! -d /srv/trc/staging/paperclip-home ]; then
            echo "/srv/trc/staging/paperclip-home does not exist."
            echo "Create it by hand (owned by UID 1000) -- this deploy will not create it, so a typo'd path can never be mistaken for a fresh install."
            exit 1
          fi
          # -L is required: [ -d ] above and Docker's bind mount both follow
          # symlinks, so ownership must be read from the target, not the
          # link, or a symlink could pass this guard while the directory it
          # actually resolves to is wrong.
          owner="$(stat -Lc '%u' /srv/trc/staging/paperclip-home)"
          if [ "$owner" != "1000" ]; then
            echo "/srv/trc/staging/paperclip-home is owned by UID $owner, expected 1000."
            echo "Bind mounts carry host ownership straight through and the container runs as node=1000, so the first write to /paperclip would fail with EACCES and the container would crash-loop."
            exit 1
          fi

          # An empty-but-present directory normally means a deploy is about to
          # bootstrap a fresh UNCLAIMED instance over data that should have been
          # migrated. Paperclip, however, is ruled to start FULLY FRESH in Phase
          # 2 -- no Postgres volume copy and no ./paperclip-data copy -- so on
          # that first deploy the directory is legitimately empty and this guard
          # would block it. allow_bootstrap is the explicit opt-in; the
          # existence and UID checks above stay unconditional either way.
          #
          # `&&` (not `||`) is deliberate: this must fail only when BOTH are
          # missing, so a legitimately partial state is not blocked.
          if [ "$ALLOW_BOOTSTRAP" = "true" ]; then
            echo "allow_bootstrap=true: permitting an empty paperclip-home for a fresh instance."
          elif [ ! -f /srv/trc/staging/paperclip-home/instances/default/config.json ] \
               && [ ! -f /srv/trc/staging/paperclip-home/secrets/master.key ]; then
            echo "/srv/trc/staging/paperclip-home exists but holds no instance state:"
            echo "neither instances/default/config.json nor secrets/master.key is present."
            echo "Deploying against it would let Paperclip bootstrap a fresh UNCLAIMED instance over data that should have been migrated."
            echo "If this is a deliberate fresh install, re-run with allow_bootstrap=true."
            exit 1
          fi

          mkdir -p /srv/trc/staging/paperclip /srv/trc/staging/fingerprints
          REMOTE
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            deploy/trc/docker-compose-staging-trc.yml \
            "$SSH_USER@$SSH_HOST:/srv/trc/staging/paperclip/"

      - name: Render .env and deploy
        env:
          SSH_HOST: ${{ secrets.TRC_SSH_HOST }}
          SSH_USER: ${{ secrets.TRC_SSH_USER }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
          DIGEST: ${{ inputs.image_digest }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SIGNING_SECRET: ${{ secrets.PAPERCLIP_TOOL_ACTION_SIGNING_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PAPERCLIP_PUBLIC_URL: ${{ secrets.PAPERCLIP_PUBLIC_URL }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -eu
          # Never `set -x` in this step: it would print every secret below.

          case "$PAPERCLIP_PUBLIC_URL" in
            ""|*localhost*|*127.0.0.1*)
              echo "::error::PAPERCLIP_PUBLIC_URL must be the external URL a browser can reach from outside the host. It is baked into auth callbacks and shown to the first admin, so a localhost value is wrong on a server."
              exit 1 ;;
          esac

          # Stricter than the generic guard below, and kept as well as it:
          # POSTGRES_PASSWORD is additionally interpolated into DATABASE_URL,
          # where @ : / and ? corrupt the connection string too.
          case "$POSTGRES_PASSWORD" in
            ""|*[@:/?#]*)
              echo "::error::POSTGRES_PASSWORD must be non-empty and must not contain @ : / ? or #. It is interpolated into DATABASE_URL, where those characters silently corrupt the connection string with no error from compose. Use: openssl rand -hex 32"
              exit 1 ;;
          esac

          # Charset guard for every remaining secret rendered into .env below.
          # Compose's env_file parser interpolates `$VAR` and `${VAR}` inside
          # values and treats an unquoted ` #` as the start of a comment, so a
          # secret containing $, a backtick or # reaches the container as a
          # DIFFERENT string than the repository secret holds. Nothing errors:
          # the service starts, and the damage shows up later as auth cookies
          # that never validate or tool actions rejected as unsigned. Values are
          # written unquoted on purpose, so rejecting the characters is the only
          # reliable guard.
          #
          # PAPERCLIP_PUBLIC_URL is checked for these three characters ONLY: it
          # legitimately contains : and /, so the stricter POSTGRES_PASSWORD
          # pattern above must not be applied to it.
          reject_interpolation_chars() {
            case "$2" in
              *'$'*|*'`'*|*'#'*)
                echo "::error::$1 must not contain \$, a backtick or #. Compose's .env parser interpolates the first two and treats # as a comment, so the container would receive a different value than the secret holds."
                exit 1 ;;
            esac
          }
          reject_interpolation_chars BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET"
          reject_interpolation_chars PAPERCLIP_TOOL_ACTION_SIGNING_SECRET "$SIGNING_SECRET"
          reject_interpolation_chars OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          reject_interpolation_chars PAPERCLIP_PUBLIC_URL "$PAPERCLIP_PUBLIC_URL"

          # Not yet parameterised via a secret (see PAPERCLIP_HOME_DIR below),
          # but guarded anyway: a relative path would silently resolve against
          # whatever directory compose is invoked from on the host.
          PAPERCLIP_HOME_DIR=/srv/trc/staging/paperclip-home
          case "$PAPERCLIP_HOME_DIR" in
            /*) ;;
            *) echo "::error::PAPERCLIP_HOME_DIR must be an absolute path"; exit 1 ;;
          esac

          umask 077
          {
            printf 'PAPERCLIP_IMAGE=ghcr.io/nature-technologies/trc-paperclip@%s\n' "$DIGEST"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
            printf 'PAPERCLIP_TOOL_ACTION_SIGNING_SECRET=%s\n' "$SIGNING_SECRET"
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
            printf 'PAPERCLIP_PUBLIC_URL=%s\n' "$PAPERCLIP_PUBLIC_URL"
            printf 'PAPERCLIP_HOME_DIR=%s\n' "$PAPERCLIP_HOME_DIR"
            printf 'PAPERCLIP_BIND=0.0.0.0\n'
          } > env.staging
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" env.staging \
            "$SSH_USER@$SSH_HOST:/srv/trc/staging/paperclip/.env"
          rm -f env.staging

          if [ -n "$GHCR_READ_TOKEN" ]; then
            printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              'docker login ghcr.io -u trc-deploy --password-stdin'
          fi

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /srv/trc/staging/paperclip
          chmod 600 .env

          # The paperclip-home existence, ownership and instance-state guards
          # deliberately live in `Copy deploy artifacts`, one step earlier, so
          # they run before this step's .env reaches the host.

          docker network create poc-net 2>/dev/null || true

          # Deliberately NOT `docker volume create`. Compose refuses to start when
          # an external volume is missing, and that fail-closed behaviour is the
          # whole point of declaring them external: pre-creating one here would
          # boot Postgres against a silently EMPTY volume -- it would initialise a
          # brand-new database, Paperclip would come up with no data, and every
          # smoke test below would still pass. The volume is created during the
          # Phase 2 migration, not by a deploy. Paperclip starts fresh in Phase 2,
          # so creating it there means `docker volume create` run once by hand,
          # deliberately, rather than on every dispatch.
          if ! docker volume inspect trc-staging-paperclip-db >/dev/null 2>&1; then
            echo "the external volume trc-staging-paperclip-db does not exist on this host."
            echo "Create it during the Phase 2 migration; this deploy will not create it."
            exit 1
          fi

          # Record the rollback target. Read the digest from the IMAGE, not the
          # container: a container's inspect output has no RepoDigests key at
          # all, so `docker inspect <container>` cannot produce this.
          if img="$(docker inspect --format '{{.Image}}' paperclip 2>/dev/null)"; then
            echo "rollback target (digest currently running):"
            docker image inspect "$img" \
              --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}(built locally, no digest){{end}}'
          else
            echo "no paperclip container running yet"
          fi

          flock /var/lock/trc-deploy.lock -c 'set -e
            cd /srv/trc/staging/paperclip
            docker compose -f docker-compose-staging-trc.yml pull
            docker compose -f docker-compose-staging-trc.yml up -d --remove-orphans
          '
          REMOTE

      - name: Smoke test
        env:
          SSH_HOST: ${{ secrets.TRC_SSH_HOST }}
          SSH_USER: ${{ secrets.TRC_SSH_USER }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
        run: |
          set -eu
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          # `pg_isready -U paperclip` was here and could not do this job: it only
          # asks whether the server accepts connections and never authenticates,
          # so it returns 0 against a password it has never seen. A credential
          # mismatch is precisely what has to be caught, because Postgres IGNORES
          # POSTGRES_PASSWORD on an already-initialised data directory -- so if
          # this volume ever stops being a fresh one, the rendered secret and the
          # cluster's stored secret can silently diverge. Run a real query.
          #
          # Read the value with sed, never by sourcing the .env: it is written
          # for Compose's env_file parser and strips no shell quoting of its own
          # (see the render step).
          PGPASSWORD="$(sed -n 's/^POSTGRES_PASSWORD=//p' /srv/trc/staging/paperclip/.env)"
          if [ -z "$PGPASSWORD" ]; then
            echo "could not read POSTGRES_PASSWORD from the deployed .env"
            exit 1
          fi
          export PGPASSWORD
          # `-e PGPASSWORD` with no `=value` passes the value from THIS shell's
          # environment, so it never enters the docker CLI's argv and cannot be
          # read out of the host's process list.
          #
          # `-h postgres` is load-bearing, not cosmetic. Without it psql uses the
          # unix socket, and this image's generated pg_hba.conf grants
          # `local all all trust` (and the same for 127.0.0.1), so ANY password
          # succeeds and the check proves nothing -- the same blind spot
          # pg_isready had. Connecting to the compose service alias goes over
          # poc-net from a non-loopback address, which falls through to
          # `host all all all scram-sha-256` and genuinely authenticates.
          #
          # -w so a missing password fails immediately instead of hanging on a
          # prompt, and no -i so psql cannot consume the rest of this heredoc.
          docker exec -e PGPASSWORD paperclip-postgres \
            psql -h postgres -U paperclip -d paperclip -w -qtAc 'select 1' >/dev/null
          echo "postgres OK (authenticated with the deployed password)"

          ok=0
          for i in $(seq 1 45); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                      http://127.0.0.1:3100/ || echo 000)"
            case "$code" in
              2*|3*) ok=1; break ;;
            esac
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "paperclip never answered on :3100 (last status ${code:-none})"
            docker logs --tail 50 paperclip || true
            exit 1
          fi
          echo "paperclip OK (HTTP $code)"

          # Third copy of HERMES_API_KEY. It lives in the instance config.json,
          # which is read-only after claiming, so CI cannot set it -- only
          # detect drift. Fingerprints are compared rather than secrets, and
          # the scan is schema-agnostic on purpose: the config's shape is not a
          # stable contract. Warn only; this copy is not CI's to repair.
          fpr=/srv/trc/staging/fingerprints/hermes-api-key
          cfg=/srv/trc/staging/paperclip-home/instances/default/config.json
          if [ ! -f "$fpr" ]; then
            echo "::warning::no hermes-agent fingerprint at $fpr -- deploy trc-hermes-agent first to enable this check."
          elif [ ! -f "$cfg" ]; then
            echo "::warning::no instance config at $cfg -- the instance may not be claimed yet, so its hermes_gateway wiring cannot be verified."
          else
            want="$(cat "$fpr")"
            if grep -oE '"[A-Za-z0-9_-]{16,}"' "$cfg" \
                 | tr -d '"' \
                 | while read -r v; do printf '%s' "$v" | sha256sum | cut -c1-12; done \
                 | grep -qx "$want"; then
              echo "paperclip's hermes_gateway key matches hermes-agent"
            else
              echo "::warning::no value in $cfg matches hermes-agent's HERMES_API_KEY fingerprint. Paperclip's gateway calls will be rejected with 401 while chat keeps working. That file is read-only after claiming, so fixing it is a manual step."
            fi
          fi
          REMOTE
