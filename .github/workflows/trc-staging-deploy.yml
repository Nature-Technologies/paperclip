name: TRC staging deploy (paperclip)
run-name: Deploy paperclip to Dev/Test Server

# Additive and TRC-only. Builds AND deploys in one run.
#
# THE BUILD RUNS ON THE RUNNER. DOCKER_HOST is bound PER STEP, never at job
# level: a job-level binding puts every docker call in the job on the deploy
# host, the build included, which is the arrangement this replaced. That cost
# the staging host disk, CPU contention with the live containers, and build
# time. validate_compose.py asserts the per-step form, and requires every
# daemon-touching step to declare which daemon it talks to.
#
# The finished image reaches the host as a stream: `docker save` on the runner
# piped into a `docker load` bound to the host INLINE. Inline is load-bearing
# -- as a step-level env: it would send the save to the host too, and that
# fails silently, re-loading whatever image is already there.
#
# There is still no registry. `push: false` leaves the image in the runner's
# store, and the compose service sets `pull_policy: never` so a missing image
# fails closed instead of reaching out to GHCR, where the retired
# publish-then-pull scheme left tags that a rollback dispatch could otherwise
# silently start.
#
# ROLLBACK IS HOST-LOCAL. `:git-<7-char-sha>` tags exist only in that host's
# image store, now bounded to the newest few by the retention step at the end.
# A `docker image prune -a` or a host rebuild destroys every rollback target.
# See docs/deploy/trc-staging.md before pruning there.
#
# Runs on a SELF-HOSTED runner: the staging host is internal and unreachable
# from a GitHub-hosted runner.
#
# Never `docker context create`/`use` here: this runner is shared with sibling
# repos (trc-hermes-agent, trc-open-webui) and `use` would repoint the DEFAULT
# daemon for their jobs too -- which would silently put the build back on the
# deploy host -- and would fail "already exists" on the second run besides.
#
# This repo carries two things neither trc-hermes-agent nor trc-open-webui
# does:
#   - a private Postgres, in the SAME compose project (see
#     deploy/trc/docker-compose-staging-trc.yml) -- paperclip and postgres
#     deliberately stay OFF trc-shared, so unlike its two siblings,
#     `trc-shared` never appears anywhere in this file
#   - a pre-existing bind mount, /srv/trc/staging/paperclip-home, that this
#     workflow does not manage the way it manages the Postgres volume: it
#     holds secrets/master.key and the only copy of the hermes_gateway
#     wiring, so outside `bootstrap: true` it is only ever verified, never
#     created. Those guards stay on plain SSH -- a DOCKER_HOST proxies the
#     Docker API, not a shell, so it cannot stat a path on the host
#     filesystem -- and run before the build even starts, so a typo'd path
#     fails in seconds rather than after a full build. Never substitute a
#     bind-mounted probe container for these checks either: Docker creates a
#     missing bind source as root, which is exactly the failure the guard
#     exists to prevent.
#
# The build needs a pnpm lockfile refresh first: the Docker build's deps stage
# installs with a frozen lockfile, so a pnpm-lock.yaml that has drifted from
# package.json fails the build rather than the app. The build is also pinned to
# the `production` target explicitly -- the Dockerfile declares a later `cloud`
# stage, and omitting `target:` would silently deploy that stage instead.
#
# Other consequences worth knowing:
#   - no env file is written anywhere. The Deploy step binds the secrets as its
#     own `env:`, and Compose resolves the compose file's ${...} references from
#     that process environment -- so no secret touches disk on the runner or the
#     server, and nothing is dotenv-parsed, which means a `$`, backtick or `#`
#     in a value is taken literally instead of interpolated or truncated. The
#     `@ : / ? #` guard on POSTGRES_PASSWORD is about DATABASE_URL rather than
#     about parsing, so it stays
#   - there is no `docker login`, so nothing here mutates the shared
#     ~/.docker/config.json
#   - the /paperclip bind mount already exists on the host and is verified, not
#     created. Its source is resolved by the REMOTE daemon, so the path must be
#     absolute
#   - disk is guarded on BOTH machines now, for different reasons: the runner
#     needs cold-build headroom, the host only needs room to receive the image
#   - the two cleanup steps at the end bound each machine's disk and are
#     `continue-on-error`: they run after a deploy that has already been
#     smoke-tested, and a cleanup problem must not mark it red
#   - the per-job ssh-agent is left RUNNING: it holds the decrypted key in
#     memory on this persistent runner until the machine reboots, one more
#     agent per dispatch. Reap them with `pkill ssh-agent` if that matters
#   - ~/.ssh/known_hosts is genuinely shared across sibling jobs on this
#     runner. The merge below is non-destructive, so the worst case is a
#     redundant rescan; see docs/deploy/trc-staging.md for the
#     one-job-at-a-time / separate-users requirement that covers it

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: >-
          Create trc-staging-paperclip-db and /srv/trc/staging/paperclip-home
          (owned by UID 1000) instead of failing when they are missing, and
          permit an empty paperclip-home. Log loudly whichever it does. Use
          only when standing up a fresh host; leave false on every routine
          deploy.
        type: boolean
        default: false

# No `packages: write`: nothing is pushed to GHCR any more.
permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  # Still spelled as a GHCR reference even though nothing is pushed there: it
  # is now only a local tag name in the deploy host's image store, and keeping
  # the spelling means run logs and rollback tags read the same as they did
  # under the retired publish-then-pull scheme.
  IMAGE: ghcr.io/nature-technologies/trc-paperclip
  COMPOSE_FILE_PATH: deploy/trc/docker-compose-staging-trc.yml

jobs:
  deploy:
    name: Build and deploy paperclip to staging
    if: github.repository == 'Nature-Technologies/trc-paperclip'
    runs-on: self-hosted
    environment: staging
    timeout-minutes: 60
    # No job-level env: DOCKER_HOST is bound PER STEP below. A job-level
    # binding would put every docker call in this job on the staging host, the
    # build included, which is the arrangement this replaced.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Write SSH key and scan the host key
        env:
          SSH_PRIVATE_KEY_DEV: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # Never `set -x` in any step here: it would print secrets into the log.
          if [ -z "$SSH_PRIVATE_KEY_DEV" ]; then
            echo "::error::SSH_PRIVATE_KEY_DEV is empty"; exit 1
          fi
          if [ -z "$HOST" ]; then
            echo "::error::HOST is empty"; exit 1
          fi
          # The key lives ONLY under $RUNNER_TEMP -- never ~/.ssh/id_rsa -- and
          # is loaded into a per-job ssh-agent. This runner is PERSISTENT and
          # shared with sibling repos' deploys, which can run concurrently on
          # the same $HOME: a shared ~/.ssh/id_rsa would let one job's cleanup
          # delete the key a sibling job is mid-deploy with. The agent's socket
          # is exported via $GITHUB_ENV so every later step in THIS job inherits
          # it, which authenticates both the explicit ssh/scp calls below
          # (passed -i explicitly too, since that costs nothing and does not
          # depend on default-identity resolution) and -- load-bearing here --
          # the ssh the Docker CLI spawns internally for DOCKER_HOST, which
          # every docker call in this job now goes through, including the build.
          install -m 600 -D /dev/null "$RUNNER_TEMP/id_rsa"
          printf '%s\n' "$SSH_PRIVATE_KEY_DEV" > "$RUNNER_TEMP/id_rsa"
          eval "$(ssh-agent -a "$RUNNER_TEMP/ssh-agent.sock")" >/dev/null
          ssh-add "$RUNNER_TEMP/id_rsa" >/dev/null
          {
            echo "SSH_AUTH_SOCK=$RUNNER_TEMP/ssh-agent.sock"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"
          # Trust-on-first-use; StrictHostKeyChecking stays ON, so a key that
          # changes mid-run still aborts. keyscan exits 0 even when nothing
          # answered, so the `test -s` is the real reachability check -- and it
          # must fail now, not 45 minutes into the build.
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$HOST" > "$RUNNER_TEMP/known_hosts"
          test -s "$RUNNER_TEMP/known_hosts"
          install -m 700 -d ~/.ssh
          touch ~/.ssh/known_hosts
          # Drop stale entries for both spellings (keyscan writes a bare host
          # for port 22, `[host]:port` otherwise), then append. Never truncate
          # with `>` or an unadorned `tee`: ~/.ssh/known_hosts persists between
          # jobs on this runner, so the entries already there are not ours.
          ssh-keygen -R "$HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          ssh-keygen -R "[${HOST}]:${SSH_PORT}" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          cat "$RUNNER_TEMP/known_hosts" >> ~/.ssh/known_hosts

      - name: Verify the runner can build
        # No DOCKER_HOST, deliberately: this asks about THIS machine. The build
        # runs here now, so the runner's daemon, cores and free disk are the
        # build's preconditions -- and a runner with no local daemon has to fail
        # here, in seconds, rather than part-way through a pnpm install.
        #
        # Stays after the SSH key step: no daemon-touching step may precede it.
        run: |
          set -eu
          if ! docker version --format 'local daemon {{.Server.Version}}'; then
            echo "::error::no local Docker daemon on this runner. The build runs here now, not on the staging host. Install dockerd on the runner, or point this job at a dedicated build host."
            exit 1
          fi
          echo "cores: $(nproc)"
          # RAM matters more than cores here, and it is the one thing that made
          # the move off the deploy host fail the first time. The UI's
          # `vite build` runs INSIDE the image build, and V8 sizes its default
          # old-space heap at roughly HALF of the memory it can see (capped near
          # 4 GB). `docker build` applies no memory limit by default, so what it
          # sees is this machine's RAM: a 4 GB runner gives Node a ~1.7 GB
          # ceiling, which this build exceeds and aborts on with
          # "Ineffective mark-compacts near heap limit" and exit 134 -- four
          # minutes into the image build, naming the heap but not the cause.
          #
          # 8 GB is the threshold because that is where the default heap reaches
          # the same ~4 GB that ubuntu-latest builds this image with today (see
          # docker.yml, which builds the identical `production` target with no
          # heap flag). Read from /proc/meminfo rather than a node one-liner:
          # this step runs before Setup Node.js, and the runner has no system
          # Node on PATH.
          mem_kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo 2>/dev/null) || mem_kb=""
          case "$mem_kb" in
            ''|*[!0-9]*)
              echo "::warning::Could not read total memory on the runner - check free -h there manually." ;;
            *)
              mem_gb=$((mem_kb / 1000000))
              if [ "$mem_kb" -lt 8000000 ]; then
                echo "::error::Only ${mem_gb} GB RAM on the runner. V8 sizes its default heap at about half of visible memory, so the UI's vite build gets roughly a $((mem_kb / 2000000)) GB ceiling and aborts with exit 134 part-way through the image build. Give this runner 8 GB or more, or build on a larger host."
                exit 1
              elif [ "$mem_kb" -lt 12000000 ]; then
                echo "::warning::${mem_gb} GB RAM on the runner - enough for the UI build, but with little margin."
              else
                echo "OK - ${mem_gb} GB RAM on the runner."
              fi ;;
          esac
          # The build cache lives on this machine now, so this is where
          # cold-build headroom has to exist. BuildKit's out-of-space failures
          # name everything except the cause.
          avail=$(df --output=avail -B1 /var/lib/docker 2>/dev/null | tail -1) || avail=""
          case "$avail" in
            ''|*[!0-9]*)
              echo "::warning::Could not read free space on the runner - check df -h there manually." ;;
            *)
              gb=$((avail / 1000000000))
              if [ "$avail" -lt 15000000000 ]; then
                echo "::error::Only ${gb} GB free on the runner. The build cache lives here now and a cold build needs more than that."
                exit 1
              elif [ "$avail" -lt 30000000000 ]; then
                echo "::warning::${gb} GB free on the runner - enough for a cached build, tight for a cold one."
              else
                echo "OK - ${gb} GB free on the runner."
              fi ;;
          esac

      - name: Verify the paperclip-home guards
        # Plain SSH, never the inherited DOCKER_HOST: a DOCKER_HOST proxies the
        # Docker API, not a shell, so it has no way to stat a path on the host
        # filesystem. Runs before the build for the same reason the host
        # preconditions below do -- a wrong path or a wrong owner must fail the
        # run in seconds rather than after a full build.
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -eu
          # A workflow_dispatch boolean renders as exactly `true` or `false`.
          # Asserted because the value crosses into the remote shell below on
          # the ssh command line.
          case "$BOOTSTRAP" in
            true|false) ;;
            *)
              echo "::error::bootstrap must be true or false, got '$BOOTSTRAP'"
              exit 1 ;;
          esac

          ssh -i "$RUNNER_TEMP/id_rsa" -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            "BOOTSTRAP=$BOOTSTRAP bash -s" <<'REMOTE'
          set -eu
          # This literal must stay equal to the PAPERCLIP_HOME_DIR value the
          # Deploy step below binds as its own `env:`; it is the same
          # bind-mount source.
          DIR=/srv/trc/staging/paperclip-home
          if [ ! -d "$DIR" ]; then
            if [ "$BOOTSTRAP" = "true" ]; then
              echo "::warning::bootstrap=true -- creating $DIR owned by UID 1000. It will be EMPTY. Only intended for standing up a fresh host."
              mkdir -p "$DIR"
              chown 1000:1000 "$DIR"
            else
              echo "$DIR does not exist."
              echo "This deploy will not create it outside bootstrap, so a typo'd path can never be mistaken for a fresh install. Create it by hand (owned by UID 1000), or re-dispatch with bootstrap: true on a genuinely fresh host."
              exit 1
            fi
          fi
          # -L is required: [ -d ] above and Docker's bind mount both follow
          # symlinks, so ownership must be read from the target, not the
          # link, or a symlink could pass this guard while the directory it
          # actually resolves to is wrong. Unconditional -- even right after
          # a bootstrap creation above, this stays the one source of truth.
          owner="$(stat -Lc '%u' "$DIR")"
          if [ "$owner" != "1000" ]; then
            echo "$DIR is owned by UID $owner, expected 1000."
            echo "Bind mounts carry host ownership straight through and the container runs as node=1000, so the first write to /paperclip would fail with EACCES and the container would crash-loop."
            exit 1
          fi

          # An empty-but-present directory normally means a deploy is about to
          # bootstrap a fresh UNCLAIMED instance over data that should have
          # been migrated. bootstrap is the explicit opt-in for a genuinely
          # fresh instance; the existence and UID checks above stay
          # unconditional either way.
          if [ "$BOOTSTRAP" = "true" ]; then
            echo "bootstrap=true: permitting an empty $DIR for a fresh instance."
          elif [ ! -f "$DIR/instances/default/config.json" ] \
               && [ ! -f "$DIR/secrets/master.key" ]; then
            echo "$DIR exists but holds no instance state:"
            echo "neither instances/default/config.json nor secrets/master.key is present."
            echo "Deploying against it would let Paperclip bootstrap a fresh UNCLAIMED instance over data that should have been migrated."
            echo "If this is a deliberate fresh install, re-run with bootstrap: true."
            exit 1
          fi
          REMOTE

      - name: Compute image tags
        id: tags
        run: |
          set -eu
          printf 'staging=%s:staging\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          printf 'sha=%s:git-%s\n' "$IMAGE" "${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Before the build, like the host preconditions below: a secret shaped
      # like this cannot produce a working deploy, and finding that out after a
      # cold build wastes the whole run.
      - name: Verify the application secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PAPERCLIP_PUBLIC_URL: ${{ secrets.PAPERCLIP_PUBLIC_URL }}
        run: |
          set -eu
          # Kept from the retired `.env.staging` rendering; the generic
          # `$`/backtick/`#` charset guard that sat next to it is not, because
          # nothing dotenv-parses these values any more. This one is about
          # DATABASE_URL, not about parsing: the compose file interpolates
          # POSTGRES_PASSWORD into
          # `postgres://paperclip:${POSTGRES_PASSWORD}@postgres:5432/paperclip`,
          # where @ : / ? and # silently corrupt the connection string with no
          # error from compose.
          case "$POSTGRES_PASSWORD" in
            ""|*[@:/?#]*)
              echo "::error::POSTGRES_PASSWORD must be non-empty and must not contain @ : / ? or #. It is interpolated into DATABASE_URL, where those characters silently corrupt the connection string with no error from compose. Use: openssl rand -hex 32"
              exit 1 ;;
          esac

          # Baked into auth callbacks and shown to the first admin, who opens
          # it and chooses "Claim this instance", so a localhost value is wrong
          # on a server and produces an instance nobody outside the host can
          # claim.
          case "$PAPERCLIP_PUBLIC_URL" in
            ""|*localhost*|*127.0.0.1*)
              echo "::error::PAPERCLIP_PUBLIC_URL must be the external URL a browser can reach from outside the host. It is baked into auth callbacks and shown to the first admin, so a localhost value is wrong on a server."
              exit 1 ;;
          esac
          echo "application secrets OK"

      # Runs before the transfer: the host must have room to receive the image
      # and a reachable daemon. Nothing builds here any more, so this is no
      # longer a precondition of the build itself -- but a full disk still has
      # to fail before the image is streamed, not during.
      - name: Verify host preconditions
        env:
          DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT || '22' }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # A workflow_dispatch boolean renders as exactly `true` or `false`.
          # Read through an env: binding and validated here rather than spliced
          # as `${{ inputs.bootstrap }}` straight into the shell text below: the
          # same form is used in every step of all three repos' deploys, so
          # there is one place to reason about and no expression interpolation
          # inside a test.
          case "$BOOTSTRAP" in
            true|false) ;;
            *)
              echo "::error::bootstrap must be true or false, got '$BOOTSTRAP'"
              exit 1 ;;
          esac
          # Proves the SSH transport and the remote daemon before anything else.
          docker version --format 'remote daemon {{.Server.Version}}'
          # BuildKit's out-of-space failures name everything except the cause.
          # Thresholds match trc-hermes-agent's and trc-open-webui's deploys.
          avail=$(ssh -o BatchMode=yes -i "$RUNNER_TEMP/id_rsa" -p "$SSH_PORT" \
            "${USERNAME}@${HOST}" \
            'df --output=avail -B1 /var/lib/docker 2>/dev/null | tail -1') || avail=""
          case "$avail" in
            ''|*[!0-9]*)
              echo "::warning::Could not read free space on the deploy host - check df -h manually." ;;
            *)
              gb=$((avail / 1000000000))
              if [ "$avail" -lt 10000000000 ]; then
                echo "::error::Only ${gb} GB free on the deploy host. Nothing builds here any more, but the incoming image load still needs room for the new image alongside the one running. See docs/deploy/trc-staging.md for what is safe to prune - note that pruning images also destroys rollback targets."
                exit 1
              elif [ "$avail" -lt 20000000000 ]; then
                echo "::warning::${gb} GB free on the deploy host - enough to receive an image, tight if it grows."
              else
                echo "OK - ${gb} GB free on the deploy host."
              fi ;;
          esac
          # Fail closed on the external volume, UNLESS bootstrapping a fresh
          # host: Compose refuses to start when an external volume is missing,
          # and that is the guard. Creating it on a routine deploy would boot
          # Postgres against a silently EMPTY volume -- a brand new database,
          # Paperclip with no data -- with every smoke test below still
          # passing.
          if docker volume inspect trc-staging-paperclip-db >/dev/null 2>&1; then
            :
          elif [ "$BOOTSTRAP" = "true" ]; then
            echo "::warning::bootstrap=true -- creating trc-staging-paperclip-db. It will be EMPTY. Only intended for standing up a fresh host."
            docker volume create trc-staging-paperclip-db
          else
            echo "::error::external volume trc-staging-paperclip-db does not exist on the host. This deploy will not create it silently -- create it by hand, or re-dispatch with bootstrap: true on a genuinely fresh host."
            exit 1
          fi
          # No trc-shared check here: paperclip and postgres are poc-net-only
          # by design -- only hermes-agent and open-webui reach the trc-backend
          # stack, so this project has nothing to verify on that bridge.
          #
          # poc-net carries no data, so creating it is always safe and idempotent.
          docker network create poc-net 2>/dev/null || true

      # Node BEFORE pnpm, and the order is load-bearing on this runner.
      #
      # `pnpm/action-setup` runs a self-installer that shells out to `node` by
      # name. This self-hosted runner has NO system Node on PATH -- the only
      # copy is the runner's own bundled one, which hosts the action's JS but
      # is not on PATH for anything the action spawns. With pnpm first the
      # installer therefore died in ~1s with a bare "self-installer exits with
      # code 1" and no other output: the child never got far enough to report
      # anything, which is why the message names nothing useful.
      #
      # `actions/setup-node` needs no pre-existing Node -- it installs one into
      # $RUNNER_TOOL_CACHE and puts it on PATH -- so it is what makes the pnpm
      # step possible, not the reverse.
      #
      # pr.yml has these two in the opposite order and passes, but only because
      # ubuntu-latest ships Node preinstalled. Do not "align" this file to it.
      #
      # The usual reason to want pnpm first -- `cache: pnpm` on setup-node,
      # which needs a pnpm binary to locate the store -- does not apply here:
      # no cache is requested, so there is no chicken-and-egg to trade off.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Refresh lockfile for Docker build context
        # Runs on the RUNNER even though the build runs on the host: the build
        # context is assembled here and uploaded, so the lockfile the deps
        # stage installs from is the one this step leaves behind. The Docker
        # build's deps stage installs with a frozen lockfile, so a
        # pnpm-lock.yaml that has drifted from package.json fails the build
        # rather than the app.
        run: |
          set -eu
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The RUNNER's own daemon, and no DOCKER_HOST anywhere in scope to
          # send it elsewhere. `driver: docker` binds the build to that daemon's
          # persistent layer store, which is what keeps the cache warm between
          # dispatches now that the deploy host no longer holds it. The default
          # container driver would start empty on every dispatch.
          driver: docker

      - name: Build the image on the runner
        uses: docker/build-push-action@v7
        with:
          context: .
          # Pin to the production stage explicitly: the Dockerfile declares a
          # later `cloud` stage, and without a target the default would
          # silently become that stage instead.
          target: production
          # No registry, and with `driver: docker` no `load:` either -- the
          # build writes straight into the runner's image store, which is what
          # the next step streams to the deploy host.
          push: false
          tags: |
            ${{ steps.tags.outputs.staging }}
            ${{ steps.tags.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          # No `platforms`: the runner and the deploy host are both linux/amd64,
          # and naming one switches on QEMU emulation. No cache-from/to: the
          # runner daemon's own layer store is the cache, and the docker driver
          # cannot use the gha cache backend anyway. No attestations: they force
          # a manifest list and an extra export pass for nothing.
          provenance: false

      - name: Ship the image to the host
        # The image is built on the runner now, so it has to reach the deploy
        # host's image store before compose can start it.
        #
        # DOCKER_HOST is bound INLINE on the `docker load` only, never as this
        # step's `env:`. A step-level binding would send `docker save` to the
        # host as well, and that failure is silent rather than loud: a
        # :git-<sha> image already present there would be saved and re-loaded,
        # deploying whatever the host was already running instead of what this
        # run built. validate_compose.py asserts the inline form.
        #
        # `docker load` over an ssh:// endpoint streams the tar to the remote
        # daemon through the Docker CLI's own SSH transport, so the host needs
        # nothing but dockerd -- no docker CLI, no zstd, no registry. Both tags
        # name the same image, so one stream carries both and the layers are
        # shared.
        #
        # Uncompressed on purpose to start with. If a dispatch shows the
        # transfer is slow, the fallback is
        #   docker save ... | zstd -T0 | ssh "$USER@$HOST" 'zstd -d | docker load'
        # which needs zstd on both machines and a docker CLI on the host.
        env:
          REMOTE_DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT || '22' }}
          SHA_TAG: ${{ steps.tags.outputs.sha }}
          STAGING_TAG: ${{ steps.tags.outputs.staging }}
        run: |
          set -eu
          echo "shipping $SHA_TAG to the deploy host"
          docker save "$SHA_TAG" "$STAGING_TAG" | DOCKER_HOST="$REMOTE_DOCKER_HOST" docker load

      - name: Confirm the image landed on the host
        # A truncated or silently failed transfer must not reach `compose up`.
        # Without this, `up -d` would either start the PREVIOUS image or fail
        # closed on pull_policy: never -- the first of which is silent.
        env:
          DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT || '22' }}
          SHA_TAG: ${{ steps.tags.outputs.sha }}
        run: |
          set -eu
          if ! docker image inspect "$SHA_TAG" >/dev/null 2>&1; then
            echo "::error::$SHA_TAG is not in the deploy host's image store after the transfer. Nothing has been deployed; the previous image is still running. Re-dispatch."
            exit 1
          fi
          echo "$SHA_TAG is present on the deploy host"

      - name: Deploy
        # Compose resolves the compose file's ${...} references from THIS
        # process environment. No env file is written, on the runner or the
        # server, so no secret ever touches disk -- and because nothing is
        # parsed as dotenv, values are taken literally: a `$`, backtick or `#`
        # in a secret survives instead of being interpolated or truncated.
        #
        # Every variable the compose file references must be listed here, since
        # there is no other source for them; deploy/trc/validate_compose.py
        # asserts exactly that.
        env:
          DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT || '22' }}
          # The IMMUTABLE tag this run built, not the moving `:staging`
          # pointer -- so the deploy runs exactly what this run built and "what
          # is running" is unambiguous. To roll back, hardcode an older
          # `:git-<7>` tag here on a throwaway branch, but only one still in
          # the host's image store: these tags are HOST-LOCAL now and a
          # `docker image prune -a` there destroys every rollback target. See
          # docs/deploy/trc-staging.md.
          PAPERCLIP_IMAGE: ${{ steps.tags.outputs.sha }}
          PAPERCLIP_BIND: 0.0.0.0
          PAPERCLIP_HOME_DIR: /srv/trc/staging/paperclip-home
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${{ secrets.PAPERCLIP_TOOL_ACTION_SIGNING_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PAPERCLIP_PUBLIC_URL: ${{ secrets.PAPERCLIP_PUBLIC_URL }}
        run: |
          set -eu
          echo "deploying $PAPERCLIP_IMAGE"
          # No `pull`: the transfer step above streamed the image into THIS
          # daemon's store and the step after it confirmed it arrived, and the
          # compose service sets `pull_policy: never` so a missing image fails
          # closed instead of reaching for GHCR. Postgres
          # keeps the default policy -- postgres:17-alpine is an upstream image
          # this workflow never builds, so it must still be fetchable.
          # No `--env-file`: see the note above.
          docker compose -f "$COMPOSE_FILE_PATH" up -d --remove-orphans
          # Best-effort record of what landed. There is no digest to print any
          # more -- RepoDigests is only ever set for an image that went through
          # a registry -- so the local image id is the record, and it must
          # never fail an otherwise-successful deploy.
          if img="$(docker inspect --format '{{.Image}}' paperclip 2>/dev/null)"; then
            echo "deployed image id: $img"
          else
            echo "could not inspect paperclip for a record (non-fatal)"
          fi

      - name: Smoke test
        env:
          DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT || '22' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # `pg_isready -U paperclip` cannot do this job: it only asks whether
          # the server accepts connections and never authenticates, so it
          # returns 0 against a password it has never seen. A credential
          # mismatch is precisely what has to be caught, because Postgres
          # IGNORES POSTGRES_PASSWORD on an already-initialised data directory
          # -- so if this volume ever stops being a fresh one, the deployed
          # secret and the cluster's stored secret can silently diverge. Run a
          # real query.
          export PGPASSWORD="$POSTGRES_PASSWORD"
          # `-e PGPASSWORD` with no `=value` passes the value from THIS shell's
          # environment, so it never enters the docker CLI's argv and cannot be
          # read out of the host's process list.
          #
          # `-h postgres` is load-bearing, not cosmetic. Without it psql uses the
          # unix socket, and this image's generated pg_hba.conf grants
          # `local all all trust` (and the same for 127.0.0.1), so ANY password
          # succeeds and the check proves nothing. Connecting to the compose
          # service alias goes over poc-net from a non-loopback address, which
          # falls through to `host all all all scram-sha-256` and genuinely
          # authenticates.
          #
          # -w so a missing password fails immediately instead of hanging on a
          # prompt. No -i: this docker exec is not fed a heredoc, and -i would
          # consume the rest of this script.
          docker exec -e PGPASSWORD paperclip-postgres \
            psql -h postgres -U paperclip -d paperclip -w -qtAc 'select 1' >/dev/null
          echo "postgres OK (authenticated with the deployed password)"

          # Paperclip listens on 3100 INSIDE the container, and compose maps
          # 3100:3100, so checking :3100 from inside the container (over
          # DOCKER_HOST, via docker exec) is equivalent to checking the
          # published port -- curl is available in the image (see Dockerfile).
          # Accept a 2xx or a redirect to sign-in.
          ok=0
          code=000
          for _ in $(seq 1 45); do
            code="$(docker exec paperclip \
                      curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                      http://127.0.0.1:3100/ 2>/dev/null || echo 000)"
            case "$code" in
              2*|3*) ok=1; break ;;
            esac
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::paperclip never answered on :3100 (last status $code)"
            docker logs --tail 50 paperclip || true
            exit 1
          fi
          echo "paperclip OK (HTTP $code)"

          # Third copy of HERMES_API_KEY. It lives in the instance config.json,
          # which is read-only after claiming, so CI cannot set it -- only
          # detect drift. Fingerprints are compared rather than secrets, and
          # the scan is schema-agnostic on purpose: the config's shape is not a
          # stable contract. Warn only; this copy is not CI's to repair. Reads
          # files on the host filesystem, so this comparison stays on SSH
          # rather than DOCKER_HOST.
          ssh -i "$RUNNER_TEMP/id_rsa" -p "$SSH_PORT" "${USERNAME}@${HOST}" 'bash -s' <<'REMOTE'
          set -eu
          fpr=/srv/trc/staging/fingerprints/hermes-api-key
          cfg=/srv/trc/staging/paperclip-home/instances/default/config.json
          if [ ! -f "$fpr" ]; then
            echo "::warning::no hermes-agent fingerprint at $fpr -- deploy trc-hermes-agent first to enable this check."
          elif [ ! -f "$cfg" ]; then
            echo "::warning::no instance config at $cfg -- the instance may not be claimed yet, so its hermes_gateway wiring cannot be verified."
          else
            want="$(cat "$fpr")"
            if grep -oE '"[A-Za-z0-9_-]{16,}"' "$cfg" \
                 | tr -d '"' \
                 | while read -r v; do printf '%s' "$v" | sha256sum | cut -c1-12; done \
                 | grep -qx "$want"; then
              echo "paperclip's hermes_gateway key matches hermes-agent"
            else
              echo "::warning::no value in $cfg matches hermes-agent's HERMES_API_KEY fingerprint. Paperclip's gateway calls will be rejected with 401 while chat keeps working. That file is read-only after claiming, so fixing it is a manual step."
            fi
          fi
          REMOTE

      - name: Prune old images on the host
        # Deliberately NOT `docker image prune -a`: :git-<sha> tags exist only
        # in this host's image store and are the only rollback targets there
        # are, so that command destroys every one of them. Keep the newest few
        # and whatever is running; remove the rest.
        #
        # continue-on-error because the deploy has already succeeded and been
        # smoke-tested by the time this runs. A cleanup problem is a warning,
        # not a failed deploy.
        continue-on-error: true
        env:
          DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT || '22' }}
          KEEP: "5"
        run: |
          set -eu
          # --no-trunc so the ID is the full sha256: form that `docker inspect`
          # returns below; the truncated form would never compare equal and the
          # running image would be a removal candidate on every deploy.
          running="$(docker inspect --format '{{.Image}}' paperclip 2>/dev/null || true)"
          echo "keeping the newest $KEEP :git-* images, plus the running one"
          docker images --no-trunc \
            --filter "reference=${IMAGE}:git-*" \
            --format '{{.CreatedAt}}|{{.ID}}|{{.Repository}}:{{.Tag}}' \
            | sort -r \
            | tail -n +"$((KEEP + 1))" \
            | while IFS='|' read -r _ id tag; do
                if [ -n "$running" ] && [ "$id" = "$running" ]; then
                  echo "keeping $tag (currently running)"
                  continue
                fi
                if docker rmi "$tag" >/dev/null 2>&1; then
                  echo "removed $tag"
                else
                  echo "::warning::could not remove $tag"
                fi
              done
          # Untagged leftovers only. Without -a this cannot touch a :git-<sha>.
          docker image prune -f >/dev/null 2>&1 || true
          echo "retention done"

      - name: Cap the runner's build cache
        # No DOCKER_HOST: this bounds the RUNNER's daemon. The layer cache moved
        # here from the deploy host, and leaving it unbounded would relocate the
        # disk problem rather than fix it.
        #
        # 30GB is a starting value, not a measured one. Retune it once a
        # dispatch shows how large the cache actually gets.
        continue-on-error: true
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha }}
          STAGING_TAG: ${{ steps.tags.outputs.staging }}
        run: |
          set -eu
          docker builder prune --keep-storage=30GB --force
          # The image itself is not the cache -- it has already been shipped and
          # the build cache above is what keeps the next build warm -- so the
          # runner's copy can go, keeping its image store flat.
          docker image rm "$SHA_TAG" "$STAGING_TAG" >/dev/null 2>&1 || true
          echo "runner cache capped"
