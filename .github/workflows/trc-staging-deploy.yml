name: TRC staging deploy (paperclip)
run-name: Deploy paperclip to Dev/Test Server

# Additive and TRC-only. Does NOT build: trc-publish.yml publishes the image and
# this rolls the configured moving tag onto the staging host.
#
# Runs `docker compose` from the runner against the host's Docker daemon over an
# SSH context. Two consequences worth knowing:
#   - the rendered .env is read by the LOCAL compose CLI and never lands on the
#     server; values reach the containers as environment, not as a file on disk
#   - a Docker context proxies the Docker API, not a shell, so it cannot stat a
#     path on the host filesystem. The three /srv/trc/staging/paperclip-home
#     guards below therefore stay on plain SSH and run BEFORE the context is
#     even created -- see "Verify the paperclip-home guards".

on:
  workflow_dispatch:
    inputs:
      allow_bootstrap:
        description: 'First deploy of a FRESH instance: permit an empty paperclip-home. Leave false otherwise.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Lets the runner authenticate to GHCR itself (see the "Log in to GHCR"
  # step) -- packages are public today, but this makes a private package work
  # too, with no new secret.
  packages: read

concurrency:
  group: trc-staging-deploy
  cancel-in-progress: false

env:
  # The moving tag this deploy tracks, published by trc-publish.yml. Change this
  # one line to follow a different branch tag.
  IMAGE_TAG: dev
  IMAGE_REPO: ghcr.io/nature-technologies/trc-paperclip
  COMPOSE_FILE_PATH: deploy/trc/docker-compose-staging-trc.yml

jobs:
  deploy:
    name: Deploy paperclip to staging
    if: github.repository == 'Nature-Technologies/trc-paperclip'
    runs-on: ubuntu-latest
    environment: Staging
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Write SSH key and scan the host key
        env:
          SSH_PRIVATE_KEY_DEV: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
        run: |
          set -eu
          # Never `set -x` in any step here: it would print secrets into the log.
          if [ -z "$SSH_PRIVATE_KEY_DEV" ]; then
            echo "::error::SSH_PRIVATE_KEY_DEV is empty"; exit 1
          fi
          if [ -z "$HOST" ]; then
            echo "::error::HOST is empty"; exit 1
          fi
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          printf '%s\n' "$SSH_PRIVATE_KEY_DEV" > ~/.ssh/id_rsa
          # Trust-on-first-use: the host key is taken from the host at deploy
          # time rather than pinned. StrictHostKeyChecking stays ON, so a key
          # that changes mid-run still aborts.
          ssh-keyscan -p "$SSH_PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan returned nothing for $HOST — host unreachable or SSH closed"
            exit 1
          fi

      - name: Verify the paperclip-home guards
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
          ALLOW_BOOTSTRAP: ${{ inputs.allow_bootstrap }}
        run: |
          set -eu
          # A workflow_dispatch boolean renders as exactly `true` or `false`.
          # Asserted because the value crosses into the remote shell below on
          # the ssh command line.
          case "$ALLOW_BOOTSTRAP" in
            true|false) ;;
            *)
              echo "::error::allow_bootstrap must be true or false, got '$ALLOW_BOOTSTRAP'"
              exit 1 ;;
          esac

          # These three checks MUST stay on plain SSH, not the Docker context
          # set up in the next step: a context proxies the Docker API, not a
          # shell, so it has no way to stat a path on the host filesystem.
          # They also MUST run before anything else in this workflow -- a
          # wrong path or a wrong owner must fail the run before any secret
          # is rendered or copied anywhere.
          #
          # Never substitute a bind-mounted probe container for these checks:
          # Docker creates a missing bind source as root, which is exactly the
          # failure this guard exists to prevent.
          ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            "ALLOW_BOOTSTRAP=$ALLOW_BOOTSTRAP bash -s" <<'REMOTE'
          set -eu
          # This literal must stay equal to the PAPERCLIP_HOME_DIR value the
          # "Render the environment file" step below renders into .env.staging;
          # it is the same bind-mount source.
          #
          # Deliberately NOT created here, in any mode, not even with
          # allow_bootstrap=true: this directory holds secrets/master.key and
          # the only copy of the hermes_gateway wiring, so a typo'd path must
          # fail loudly rather than be silently accepted as a fresh install.
          if [ ! -d /srv/trc/staging/paperclip-home ]; then
            echo "/srv/trc/staging/paperclip-home does not exist."
            echo "Create it by hand (owned by UID 1000) -- this deploy will not create it, so a typo'd path can never be mistaken for a fresh install."
            exit 1
          fi
          # -L is required: [ -d ] above and Docker's bind mount both follow
          # symlinks, so ownership must be read from the target, not the
          # link, or a symlink could pass this guard while the directory it
          # actually resolves to is wrong.
          owner="$(stat -Lc '%u' /srv/trc/staging/paperclip-home)"
          if [ "$owner" != "1000" ]; then
            echo "/srv/trc/staging/paperclip-home is owned by UID $owner, expected 1000."
            echo "Bind mounts carry host ownership straight through and the container runs as node=1000, so the first write to /paperclip would fail with EACCES and the container would crash-loop."
            exit 1
          fi

          # An empty-but-present directory normally means a deploy is about to
          # bootstrap a fresh UNCLAIMED instance over data that should have been
          # migrated. Paperclip, however, is ruled to start FULLY FRESH in Phase
          # 2 -- no Postgres volume copy and no ./paperclip-data copy -- so on
          # that first deploy the directory is legitimately empty and this guard
          # would block it. allow_bootstrap is the explicit opt-in; the
          # existence and UID checks above stay unconditional either way.
          #
          # `&&` (not `||`) is deliberate: this must fail only when BOTH are
          # missing, so a legitimately partial state is not blocked.
          if [ "$ALLOW_BOOTSTRAP" = "true" ]; then
            echo "allow_bootstrap=true: permitting an empty paperclip-home for a fresh instance."
          elif [ ! -f /srv/trc/staging/paperclip-home/instances/default/config.json ] \
               && [ ! -f /srv/trc/staging/paperclip-home/secrets/master.key ]; then
            echo "/srv/trc/staging/paperclip-home exists but holds no instance state:"
            echo "neither instances/default/config.json nor secrets/master.key is present."
            echo "Deploying against it would let Paperclip bootstrap a fresh UNCLAIMED instance over data that should have been migrated."
            echo "If this is a deliberate fresh install, re-run with allow_bootstrap=true."
            exit 1
          fi
          REMOTE

      - name: Set up the remote Docker context
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
        run: |
          set -eu
          # SSH_PORT here must match the port ssh-keyscan used above, or
          # known_hosts describes a different endpoint than the one this
          # context actually dials.
          docker context create trc-staging \
            --docker "host=ssh://${USERNAME}@${HOST}:${SSH_PORT}"
          docker context use trc-staging
          # Proves the SSH transport and the remote daemon before anything else.
          docker version --format 'remote daemon {{.Server.Version}}'

      - name: Verify host preconditions
        run: |
          set -eu
          # Fail closed on the external volume. Compose refuses to start when an
          # external volume is missing, and that is the guard: creating it here
          # would boot Postgres against a silently EMPTY volume -- it would
          # initialise a brand-new database and Paperclip would come up with no
          # data -- and every smoke test below would still pass. It is created
          # during the Phase 2 migration.
          if ! docker volume inspect trc-staging-paperclip-db >/dev/null 2>&1; then
            echo "::error::external volume trc-staging-paperclip-db does not exist on the host. Create it during the Phase 2 migration; this deploy will not create it."
            exit 1
          fi
          # No trc-shared check here: paperclip and postgres are poc-net-only by
          # design -- only hermes-agent and open-webui reach the trc-backend
          # stack, so this project has nothing to verify on that bridge.
          #
          # poc-net carries no data, so creating it is safe and idempotent.
          docker network create poc-net 2>/dev/null || true

      - name: Render the environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SIGNING_SECRET: ${{ secrets.PAPERCLIP_TOOL_ACTION_SIGNING_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PAPERCLIP_PUBLIC_URL: ${{ secrets.PAPERCLIP_PUBLIC_URL }}
        run: |
          set -eu
          # This file stays on the runner. The local compose CLI reads it and
          # sends the values to the remote daemon as container environment, so
          # no plaintext secret is ever written to the staging host.

          case "$PAPERCLIP_PUBLIC_URL" in
            ""|*localhost*|*127.0.0.1*)
              echo "::error::PAPERCLIP_PUBLIC_URL must be the external URL a browser can reach from outside the host. It is baked into auth callbacks and shown to the first admin, so a localhost value is wrong on a server."
              exit 1 ;;
          esac

          # Stricter than the generic guard below, and kept as well as it:
          # POSTGRES_PASSWORD is additionally interpolated into DATABASE_URL,
          # where @ : / and ? corrupt the connection string too.
          case "$POSTGRES_PASSWORD" in
            ""|*[@:/?#]*)
              echo "::error::POSTGRES_PASSWORD must be non-empty and must not contain @ : / ? or #. It is interpolated into DATABASE_URL, where those characters silently corrupt the connection string with no error from compose. Use: openssl rand -hex 32"
              exit 1 ;;
          esac

          # Charset guard for every secret rendered into .env.staging below,
          # extended to POSTGRES_PASSWORD too (it is compose-interpolated the
          # same as any other value, on top of the stricter guard above).
          # Compose's env_file parser interpolates $VAR and ${VAR} inside
          # values and treats an unquoted ` #` as the start of a comment, so a
          # secret containing $, a backtick or # reaches the container as a
          # DIFFERENT string than the repository secret holds. Nothing errors:
          # the service starts, and the damage shows up later as auth cookies
          # that never validate, tool actions rejected as unsigned, or a
          # DATABASE_URL Postgres itself never sees. Values are written
          # unquoted on purpose, so rejecting the characters is the only
          # reliable guard.
          #
          # PAPERCLIP_PUBLIC_URL is checked for these three characters ONLY: it
          # legitimately contains : and /, so the stricter POSTGRES_PASSWORD
          # pattern above must not be applied to it.
          reject_interpolation_chars() {
            case "$2" in
              *'$'*|*'`'*|*'#'*)
                echo "::error::$1 must not contain \$, a backtick or #. Compose's .env parser interpolates the first two and treats # as a comment, so the container would receive a different value than the secret holds."
                exit 1 ;;
            esac
          }
          reject_interpolation_chars POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
          reject_interpolation_chars BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET"
          reject_interpolation_chars PAPERCLIP_TOOL_ACTION_SIGNING_SECRET "$SIGNING_SECRET"
          reject_interpolation_chars OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          reject_interpolation_chars PAPERCLIP_PUBLIC_URL "$PAPERCLIP_PUBLIC_URL"

          umask 077
          {
            printf 'PAPERCLIP_IMAGE=%s:%s\n' "$IMAGE_REPO" "$IMAGE_TAG"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
            printf 'PAPERCLIP_TOOL_ACTION_SIGNING_SECRET=%s\n' "$SIGNING_SECRET"
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
            printf 'PAPERCLIP_PUBLIC_URL=%s\n' "$PAPERCLIP_PUBLIC_URL"
            printf 'PAPERCLIP_HOME_DIR=/srv/trc/staging/paperclip-home\n'
            printf 'PAPERCLIP_BIND=0.0.0.0\n'
          } > .env.staging

      - name: Log in to GHCR
        # Over a remote Docker context, `docker compose pull` sends THIS
        # runner's registry credentials to the remote daemon (X-Registry-Auth)
        # -- the staging host never needs, and never gets, any credential of
        # its own. Logging in here, not on the host, is what replaces the old
        # host-side `docker login` + GHCR_READ_TOKEN secret; it works whether
        # the package is public or private.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy
        run: |
          set -eu
          echo "deploying ${IMAGE_REPO}:${IMAGE_TAG}"
          docker compose --env-file .env.staging -f "$COMPOSE_FILE_PATH" pull
          docker compose --env-file .env.staging -f "$COMPOSE_FILE_PATH" up -d --remove-orphans
          # Record what actually landed, so a rollback has a named target. Read
          # from the IMAGE, not the container: a container's inspect output has
          # no RepoDigests key at all. Guarded: a digest record is best-effort
          # and must never fail an otherwise-successful deploy.
          if img="$(docker inspect --format '{{.Image}}' paperclip 2>/dev/null)"; then
            echo "deployed digest:"
            docker image inspect "$img" \
              --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}(no digest){{end}}'
          else
            echo "could not inspect paperclip for a digest record (non-fatal)"
          fi

      - name: Smoke test
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
        run: |
          set -eu
          # `pg_isready -U paperclip` cannot do this job: it only asks whether
          # the server accepts connections and never authenticates, so it
          # returns 0 against a password it has never seen. A credential
          # mismatch is precisely what has to be caught, because Postgres
          # IGNORES POSTGRES_PASSWORD on an already-initialised data directory
          # -- so if this volume ever stops being a fresh one, the rendered
          # secret and the cluster's stored secret can silently diverge. Run a
          # real query.
          export PGPASSWORD="$POSTGRES_PASSWORD"
          # `-e PGPASSWORD` with no `=value` passes the value from THIS shell's
          # environment, so it never enters the docker CLI's argv and cannot be
          # read out of the host's process list.
          #
          # `-h postgres` is load-bearing, not cosmetic. Without it psql uses the
          # unix socket, and this image's generated pg_hba.conf grants
          # `local all all trust` (and the same for 127.0.0.1), so ANY password
          # succeeds and the check proves nothing. Connecting to the compose
          # service alias goes over poc-net from a non-loopback address, which
          # falls through to `host all all all scram-sha-256` and genuinely
          # authenticates.
          #
          # -w so a missing password fails immediately instead of hanging on a
          # prompt. No -i: this docker exec is not fed a heredoc, and -i would
          # consume the rest of this script.
          docker exec -e PGPASSWORD paperclip-postgres \
            psql -h postgres -U paperclip -d paperclip -w -qtAc 'select 1' >/dev/null
          echo "postgres OK (authenticated with the deployed password)"

          # Paperclip listens on 3100 INSIDE the container, and compose maps
          # 3100:3100, so checking :3100 from inside the container (over the
          # Docker context, via docker exec) is equivalent to checking the
          # published port -- curl is available in the image (see Dockerfile).
          # Accept a 2xx or a redirect to sign-in.
          ok=0
          code=000
          for i in $(seq 1 45); do
            code="$(docker exec paperclip \
                      curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                      http://127.0.0.1:3100/ 2>/dev/null || echo 000)"
            case "$code" in
              2*|3*) ok=1; break ;;
            esac
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::paperclip never answered on :3100 (last status $code)"
            docker logs --tail 50 paperclip || true
            exit 1
          fi
          echo "paperclip OK (HTTP $code)"

          # Third copy of HERMES_API_KEY. It lives in the instance config.json,
          # which is read-only after claiming, so CI cannot set it -- only
          # detect drift. Fingerprints are compared rather than secrets, and
          # the scan is schema-agnostic on purpose: the config's shape is not a
          # stable contract. Warn only; this copy is not CI's to repair. Reads
          # files on the host filesystem, so this comparison stays on SSH
          # rather than the Docker context.
          ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" "${USERNAME}@${HOST}" 'bash -s' <<'REMOTE'
          set -eu
          fpr=/srv/trc/staging/fingerprints/hermes-api-key
          cfg=/srv/trc/staging/paperclip-home/instances/default/config.json
          if [ ! -f "$fpr" ]; then
            echo "::warning::no hermes-agent fingerprint at $fpr -- deploy trc-hermes-agent first to enable this check."
          elif [ ! -f "$cfg" ]; then
            echo "::warning::no instance config at $cfg -- the instance may not be claimed yet, so its hermes_gateway wiring cannot be verified."
          else
            want="$(cat "$fpr")"
            if grep -oE '"[A-Za-z0-9_-]{16,}"' "$cfg" \
                 | tr -d '"' \
                 | while read -r v; do printf '%s' "$v" | sha256sum | cut -c1-12; done \
                 | grep -qx "$want"; then
              echo "paperclip's hermes_gateway key matches hermes-agent"
            else
              echo "::warning::no value in $cfg matches hermes-agent's HERMES_API_KEY fingerprint. Paperclip's gateway calls will be rejected with 401 while chat keeps working. That file is read-only after claiming, so fixing it is a manual step."
            fi
          fi
          REMOTE

      - name: Remove the deploy context
        if: always()
        run: |
          set -eu
          # .env.staging is the only secret this workflow ever writes to disk
          # on the runner (never on the host). Clean it up even on failure.
          rm -f .env.staging
          docker context use default || true
          docker context rm trc-staging || true
